name: Desktop app

# Builds qpilot as an app — a .dmg for macOS (Apple silicon and Intel) and an
# installer for Windows — and tries each one where it was built: desktop/smoke.mjs
# runs a test case through the packed app, in a real Chrome.
#
#   a version tag     the installers are attached to the GitHub release of that tag
#   run by hand       the installers stay with the run as artifacts; nothing is released
#
# The apps are not signed: both systems warn on the first launch. Signing starts
# by itself once the certificates are in the repository secrets — see desktop/build.mjs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the GitHub release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the server inside the app has native parts, so each app is built on its own system
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # the server the app carries
      - run: npm ci
      - run: npm run build

      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop

      # the first user of the app on this system: starts it, runs a case, closes it
      - name: The packed app runs a test case
        run: node desktop/smoke.mjs --packed

      - uses: actions/upload-artifact@v7
        with:
          name: qpilot-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/dist/*.dmg desktop/dist/*.exe)
          # the three systems and the npm release all want the release to exist: whoever is first makes it
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
